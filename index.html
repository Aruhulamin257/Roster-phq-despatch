<html lang="bn"><head><meta charset="utf-8">

<title>রোস্টার ডিউটি ও ছুটি কেন্দ্রীয় ডেসপাচ শাখা PHQ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Amiri:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2330;--mu:#667085;--ac:#1e3a8a;--acbg:#e8edfb;--wr:#92400e;--wrbg:#fef3c7;--bd:#e3e7ef;--gd:#c9a24a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1419;--card:#1a212b;--tx:#e8ecf1;--mu:#9aa5b4;--ac:#8fa8ff;--acbg:#1a2347;--wr:#fbbf24;--wrbg:#3a2e0e;--bd:#2a3340}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1419;--card:#1a212b;--tx:#e8ecf1;--mu:#9aa5b4;--ac:#8fa8ff;--acbg:#1a2347;--wr:#fbbf24;--wrbg:#3a2e0e;--bd:#2a3340}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali',system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:14px}
h2{font-size:15px;color:var(--ac);margin:20px 0 8px;font-weight:700}
.sub{color:var(--mu);font-size:13px}
button,.btn,select,input,textarea{font:inherit;font-size:14px}
button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 12px;text-decoration:none;cursor:pointer}
button:active,.btn:active{transform:scale(.97)}
button:disabled{cursor:default}
.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}.wa{background:#16a34a;color:#fff;border-color:#16a34a}
select,input,textarea{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 10px;max-width:100%}
.fw{width:100%;margin:4px 0}.ta{width:100%;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0}.g>input,.g>select{min-width:0;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.ct{font-weight:700;margin-bottom:4px}
.nt{border-color:var(--gd)}.ni{padding:6px 0;border-top:1px solid var(--bd)}
.lk{cursor:pointer;color:var(--wr)}.lk2{cursor:pointer;border-bottom:1px dotted currentColor}
.ban{position:relative;background:radial-gradient(120% 90% at 50% 0%,#3a50c8 0%,#243595 45%,#0f1a55 100%);color:#fff;border-radius:18px;padding:14px 12px 14px;text-align:center;border-bottom:5px solid var(--gd);box-shadow:0 4px 14px rgba(15,26,85,.25)}
.ban .bis{font-family:'Amiri','Noto Naskh Arabic',serif;font-size:24px;line-height:1.5;color:#f3df9c;direction:rtl}
.ban .lg{width:86px;height:auto;margin:4px 0 6px;filter:drop-shadow(0 0 7px rgba(255,255,255,.55)) drop-shadow(0 5px 9px rgba(0,0,0,.35))}
.ban .o{font-size:13px;opacity:.9;letter-spacing:.3px}.ban .b{font-size:22px;font-weight:700;margin:2px 0}.ban .m{font-size:12px;opacity:.85}
.ban .r{display:inline-block;margin-top:8px;border:1px solid var(--gd);color:#f3df9c;border-radius:99px;padding:2px 16px;font-size:13px}
.ban .ck{margin-top:8px;font-size:13px}.ban .ck b{font-size:22px;display:block;letter-spacing:.5px}
.tabs{display:flex;gap:5px;margin:10px 0;overflow-x:auto}.tabs button{flex:1;min-width:62px;padding:6px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;line-height:1.3}.tabs button span{font-size:17px}.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.hero{background:linear-gradient(135deg,var(--acbg),var(--card));border:1px solid var(--ac);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(30,58,138,.15)}
.hl{font-size:15px;font-weight:700;color:var(--ac);margin-bottom:6px}.hr{display:flex;gap:12px;align-items:center}.hn{font-size:21px;font-weight:700;line-height:1.3}.hd2{margin-top:8px;font-weight:600}
.note{background:var(--wrbg);color:var(--wr);border-radius:10px;padding:7px 10px;font-size:13px;margin-top:8px}.note.n2c{background:var(--acbg);color:var(--ac)}
.chip{border-radius:99px;padding:2px 10px;font-size:12px;white-space:nowrap}.c1{background:var(--ac);color:var(--bg)}.c2{background:#dcfce7;color:#166534}.c3{background:var(--acbg);color:var(--ac)}.c4{background:var(--wrbg);color:var(--wr)}
.tag{background:var(--acbg);color:var(--ac);border-radius:8px;padding:1px 8px;font-size:12px;margin-left:2px}
.wk{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:14px;padding:10px 12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.wk.cur{border-color:var(--ac);box-shadow:0 2px 10px rgba(30,58,138,.2)}
.wh{display:flex;align-items:center;gap:10px}.db{min-width:66px;text-align:center;background:linear-gradient(160deg,var(--acbg),var(--card));border:1px solid var(--bd);border-radius:10px;padding:3px 4px;color:var(--ac)}.db b{display:block;font-size:13px;line-height:1.25}.db i{display:block;font-style:normal;font-size:10px;color:var(--mu)}
.wm{display:flex;gap:10px;align-items:center;flex:1;min-width:0}.wn{min-width:0}.n1{font-weight:700;font-size:15px;line-height:1.35}.ws{flex:none}
.wd{font-size:12px;color:var(--mu);margin-top:6px}
.sent{color:var(--ac);font-size:13px;margin-top:6px}.mini{padding:2px 8px;font-size:12px}
.tw{overflow-x:auto;padding:6px}.tw table{width:100%;border-collapse:collapse;font-size:13px}.tw th,.tw td{border:1px solid var(--bd);padding:6px 8px;text-align:left;white-space:nowrap}.tw th{background:var(--acbg);color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.ch{text-align:center;font-size:11px;color:var(--mu)}
.cd{min-height:62px;border:1px solid var(--bd);border-radius:8px;padding:2px;text-align:center;font-size:11px;background:var(--card);display:flex;flex-direction:column;align-items:center}
.cd.we{background:var(--acbg)}.cd.ho{background:var(--wrbg)}.cd.td{outline:2px solid var(--ac)}.cd b{font-size:12px}
.cn{font-size:9px;line-height:1.1;word-break:break-all}.cl{font-size:9px;color:var(--wr)}.cd.we .cl{color:var(--mu)}
.mc{display:flex;gap:10px;align-items:center;cursor:pointer;padding:10px}.tc{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.pf{border:1px solid var(--bd);border-radius:12px;padding:8px;margin:8px 0}.pf input[type=checkbox]{width:auto}
.si{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--bd);background:var(--card)}.si .sn{flex:1;min-width:0;font-size:14px}.si .no{width:20px;text-align:center;color:var(--ac)}.hd{touch-action:none;cursor:grab;font-size:20px;color:var(--mu);padding:0 4px}.si.drg{box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:.9}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.box{background:var(--card);border-radius:18px;padding:16px;max-width:360px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.ic{font-size:32px}.dt{font-size:17px;font-weight:700;line-height:1.5;margin:4px 0}.pl{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:14px;text-align:left}
.pp{width:112px;height:140px;object-fit:cover;border-radius:12px;border:2px solid var(--gd);margin:0 auto;display:block}
.ft{text-align:center;color:var(--mu);font-size:11px;margin:6px 0 20px;line-height:1.7}

.ban .wx{position:absolute;left:10px;top:8px;font-size:11px;line-height:1.3;text-align:left;color:#dfe6ff;background:rgba(255,255,255,.12);border-radius:10px;padding:3px 8px}.ban .wx:empty{display:none}.ban .wx b{font-size:13px;color:#fff}
.hero{background:linear-gradient(135deg,var(--acbg),var(--card) 70%)}
#app{display:block}
@media(min-width:960px){
  main{max-width:1200px;padding:20px}
  #app{display:grid;grid-template-columns:400px 1fr;column-gap:24px;align-items:start;grid-template-areas:"ban tabs" "nt main" "hero main" "ft ft"}
  .a-ban{grid-area:ban}.a-tabs{grid-area:tabs}.a-nt{grid-area:nt}.a-hero{grid-area:hero}.a-main{grid-area:main}.a-ft{grid-area:ft}
  .a-tabs{margin-top:0}.tabs{margin-top:0}.tabs button{font-size:14px;padding:9px 6px}
  .cd{min-height:84px}.box{max-width:430px}
}
</style></head>

}
