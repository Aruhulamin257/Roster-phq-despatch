<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Amiri:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2330;--mu:#667085;--ac:#1e3a8a;--acbg:#e8edfb;--wr:#92400e;--wrbg:#fef3c7;--bd:#e3e7ef;--gd:#c9a24a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1419;--card:#1a212b;--tx:#e8ecf1;--mu:#9aa5b4;--ac:#8fa8ff;--acbg:#1a2347;--wr:#fbbf24;--wrbg:#3a2e0e;--bd:#2a3340}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1419;--card:#1a212b;--tx:#e8ecf1;--mu:#9aa5b4;--ac:#8fa8ff;--acbg:#1a2347;--wr:#fbbf24;--wrbg:#3a2e0e;--bd:#2a3340}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali',system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:14px}
h2{font-size:15px;color:var(--ac);margin:20px 0 8px;font-weight:700}
.sub{color:var(--mu);font-size:13px}
button,.btn,select,input,textarea{font:inherit;font-size:14px}
button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 12px;text-decoration:none;cursor:pointer}
button:active,.btn:active{transform:scale(.97)}
button:disabled{cursor:default}
.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}.wa{background:#16a34a;color:#fff;border-color:#16a34a}
select,input,textarea{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 10px;max-width:100%}
.fw{width:100%;margin:4px 0}.ta{width:100%;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0}.g>input,.g>select{min-width:0;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.ct{font-weight:700;margin-bottom:4px}
.nt{border-color:var(--gd)}.ni{padding:6px 0;border-top:1px solid var(--bd)}
.lk{cursor:pointer;color:var(--wr)}.lk2{cursor:pointer;border-bottom:1px dotted currentColor}
.ban{position:relative;background:radial-gradient(120% 90% at 50% 0%,#3a50c8 0%,#243595 45%,#0f1a55 100%);color:#fff;border-radius:18px;padding:14px 12px 14px;text-align:center;border-bottom:5px solid var(--gd);box-shadow:0 4px 14px rgba(15,26,85,.25)}
.ban .bis{font-family:'Amiri','Noto Naskh Arabic',serif;font-size:24px;line-height:1.5;color:#f3df9c;direction:rtl}
.ban .lg{width:86px;height:auto;margin:4px 0 6px;filter:drop-shadow(0 0 7px rgba(255,255,255,.55)) drop-shadow(0 5px 9px rgba(0,0,0,.35))}
.ban .o{font-size:13px;opacity:.9;letter-spacing:.3px}.ban .b{font-size:22px;font-weight:700;margin:2px 0}.ban .m{font-size:12px;opacity:.85}
.ban .r{display:inline-block;margin-top:8px;border:1px solid var(--gd);color:#f3df9c;border-radius:99px;padding:2px 16px;font-size:13px}
.ban .ck{margin-top:8px;font-size:13px}.ban .ck b{font-size:22px;display:block;letter-spacing:.5px}
.tabs{display:flex;gap:5px;margin:10px 0;overflow-x:auto}.tabs button{flex:1;min-width:62px;padding:6px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;line-height:1.3}.tabs button span{font-size:17px}.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.hero{background:linear-gradient(135deg,var(--acbg),var(--card));border:1px solid var(--ac);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(30,58,138,.15)}
.hl{font-size:15px;font-weight:700;color:var(--ac);margin-bottom:6px}.hr{display:flex;gap:12px;align-items:center}.hn{font-size:21px;font-weight:700;line-height:1.3}.hd2{margin-top:8px;font-weight:600}
.note{background:var(--wrbg);color:var(--wr);border-radius:10px;padding:7px 10px;font-size:13px;margin-top:8px}.note.n2c{background:var(--acbg);color:var(--ac)}
.chip{border-radius:99px;padding:2px 10px;font-size:12px;white-space:nowrap}.c1{background:var(--ac);color:var(--bg)}.c2{background:#dcfce7;color:#166534}.c3{background:var(--acbg);color:var(--ac)}.c4{background:var(--wrbg);color:var(--wr)}
.tag{background:var(--acbg);color:var(--ac);border-radius:8px;padding:1px 8px;font-size:12px;margin-left:2px}
.wk{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:14px;padding:10px 12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.wk.cur{border-color:var(--ac);box-shadow:0 2px 10px rgba(30,58,138,.2)}
.wh{display:flex;align-items:center;gap:10px}.db{min-width:66px;text-align:center;background:linear-gradient(160deg,var(--acbg),var(--card));border:1px solid var(--bd);border-radius:10px;padding:3px 4px;color:var(--ac)}.db b{display:block;font-size:13px;line-height:1.25}.db i{display:block;font-style:normal;font-size:10px;color:var(--mu)}
.wm{display:flex;gap:10px;align-items:center;flex:1;min-width:0}.wn{min-width:0}.n1{font-weight:700;font-size:15px;line-height:1.35}.ws{flex:none}
.wd{font-size:12px;color:var(--mu);margin-top:6px}
.sent{color:var(--ac);font-size:13px;margin-top:6px}.mini{padding:2px 8px;font-size:12px}
.tw{overflow-x:auto;padding:6px}.tw table{width:100%;border-collapse:collapse;font-size:13px}.tw th,.tw td{border:1px solid var(--bd);padding:6px 8px;text-align:left;white-space:nowrap}.tw th{background:var(--acbg);color:var(--ac)}.tw td.rl{white-space:normal;min-width:90px;max-width:150px;font-size:12px;line-height:1.35}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.ch{text-align:center;font-size:11px;color:var(--mu)}
.cd{min-height:62px;border:1px solid var(--bd);border-radius:8px;padding:2px;text-align:center;font-size:11px;background:var(--card);display:flex;flex-direction:column;align-items:center}
.cd.we{background:var(--acbg)}.cd.ho{background:var(--wrbg)}.cd.td{outline:2px solid var(--ac)}.cd b{font-size:12px}
.cn{font-size:9px;line-height:1.1;word-break:break-all}.cl{font-size:9px;color:var(--wr)}.cd.we .cl{color:var(--mu)}
.mc{display:flex;gap:10px;align-items:center;cursor:pointer;padding:10px}.tc{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.pf{border:1px solid var(--bd);border-radius:12px;padding:8px;margin:8px 0}.pf input[type=checkbox]{width:auto}
.si{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--bd);background:var(--card)}.si .sn{flex:1;min-width:0;font-size:14px}.si .no{width:20px;text-align:center;color:var(--ac)}.hd{touch-action:none;cursor:grab;font-size:20px;color:var(--mu);padding:0 4px}.si.drg{box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:.9}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.box{background:var(--card);border-radius:18px;padding:16px;max-width:360px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.ic{font-size:32px}.dt{font-size:17px;font-weight:700;line-height:1.5;margin:4px 0}.pl{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:14px;text-align:left}
.pp{width:112px;height:140px;object-fit:cover;border-radius:12px;border:2px solid var(--gd);margin:0 auto;display:block}
.ft{text-align:center;color:var(--mu);font-size:11px;margin:6px 0 20px;line-height:1.7}

.box.nbx{max-width:430px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;max-height:86vh;border:1px solid var(--bd);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.nbx .nh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,#2a3fa8 0%,#162263 70%);color:#fff;border-bottom:3px solid var(--gd)}
.nbx .nh .ni0{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.nbx .nh .nt0{flex:1;min-width:0}.nbx .nh .nt1{font-size:14px;font-weight:700;line-height:1.3}.nbx .nh .nt2{font-size:11px;opacity:.8;line-height:1.3}
.nbx .nh button{flex:none;width:30px;height:30px;padding:0;border-radius:50%;background:rgba(255,255,255,.16);border:0;color:#fff;font-size:14px;line-height:30px}
.nbx .nl{overflow:auto;padding:4px 12px 12px;flex:1;-webkit-overflow-scrolling:touch}
.nbx .nd{font-size:10.5px;letter-spacing:.3px;color:var(--gd);font-weight:700;margin:12px 2px 2px;display:flex;align-items:center;gap:8px}.nbx .nd::after{content:'';flex:1;height:1px;background:var(--bd)}
.nbx .nc{position:relative;background:var(--bg);border:1px solid var(--bd);border-left:3px solid var(--gd);border-radius:11px;padding:7px 10px 8px;margin:6px 0}
.nbx .nc.au{border-left-color:#6366f1}.nbx .nc.nw{border-color:var(--ac);border-left-color:var(--ac);background:var(--acbg)}
.nbx .nc .t1{font-size:12.5px;font-weight:700;line-height:1.4;padding-right:42px}
.nbx .nc .t2{font-size:12px;line-height:1.5;margin:2px 0 4px;white-space:pre-wrap;word-break:break-word}
.nbx .nc .t3{font-size:10.5px;color:var(--mu);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.nbx .nc .pill{border:1px solid var(--bd);border-radius:99px;padding:0 7px;font-size:10px;line-height:17px;color:var(--mu);background:var(--card)}
.nbx .nc .pill.au{color:#6366f1;border-color:#6366f1}.nbx .nc .pill.dv{color:var(--ac);border-color:var(--ac)}
.nbx .nc .newp{position:absolute;top:7px;right:8px;background:#dc2626;color:#fff;border-radius:99px;font-size:9.5px;line-height:15px;padding:0 6px;font-weight:700}
.nbx .nc details{margin-top:5px}.nbx .nc summary{font-size:10.5px;color:var(--ac);cursor:pointer;list-style:none}.nbx .nc summary::-webkit-details-marker{display:none}
.nbx .nc .who{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.nbx .nc .who span{font-size:10.5px;background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:1px 7px;line-height:1.5}
.nbx .nem{text-align:center;color:var(--mu);font-size:12px;padding:26px 8px}.nbx .nem b{display:block;font-size:30px;margin-bottom:4px;font-weight:400}
.nbx .nf{text-align:center;color:var(--mu);font-size:10.5px;padding:6px 0 0}
.cr.sr{gap:9px;padding:7px 10px 7px 8px}.cr.sr .db{min-width:58px;padding:2px 3px}.cr.sr .db .cd2{display:block;margin-top:1px;font-size:9.5px}
.cr.sr .nm2{flex:1;min-width:0}.cr.sr .nm2 b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.35;font-weight:700}
.cr.sr .nm2 span{display:block;font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.dcal{display:inline-flex;flex-direction:column;align-items:stretch;width:24px;height:24px;border-radius:5px;background:#fff;border:1px solid #b8bfce;overflow:hidden;font-style:normal;vertical-align:middle;box-shadow:0 1px 2px rgba(0,0,0,.25)}.dcal u{display:block;background:#dc2626;color:#fff;font-size:8px;line-height:9px;font-weight:700;text-decoration:none;text-align:center;letter-spacing:0}.dcal b{display:block;color:#111;font-size:13px;line-height:14px;font-weight:800;text-align:center}.dcal.big{width:38px;height:38px;border-radius:8px}.dcal.big u{font-size:11px;line-height:14px}.dcal.big b{font-size:21px;line-height:23px}
.ban .nbell{position:absolute;z-index:5;right:10px;top:8px;min-width:40px;height:40px;box-sizing:border-box;padding:0 10px;margin:0;border:0;border-radius:20px;transition:background .2s;background:rgba(255,255,255,.16);color:#fff;font-size:19px;line-height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:none}.ban .nbell .nbd{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;line-height:17px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:#dc2626;color:#fff;font-size:11px;font-weight:700;text-align:center}
.ban .nbell .nbi{font-size:19px;line-height:1;flex:none}
.ban .nbell .nbt{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;margin-left:0;font-size:12.5px;font-weight:600;letter-spacing:.3px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;transition:max-width .28s ease,opacity .2s ease,margin .28s ease}
@media (hover:hover) and (pointer:fine){.ban .nbell:hover{background:rgba(255,255,255,.28)}.ban .nbell:hover .nbt,.ban .nbell:focus-visible .nbt{max-width:110px;opacity:1;margin-left:8px}}
.ban .wx{position:absolute;z-index:5;left:10px;top:8px;font-size:11px;line-height:1.3;text-align:left;color:#dfe6ff;background:rgba(255,255,255,.12);border-radius:10px;padding:3px 8px}.ban .wx:empty{display:none}.ban .wx b{font-size:13px;color:#fff}
.hero{background:linear-gradient(135deg,var(--acbg),var(--card) 70%)}
#app{display:flex;flex-direction:column}.colL,.colR{display:contents}.a-ban{order:1}.a-tabs{order:2}.a-nt{order:3}.a-hero{order:4}.a-main{order:5}.a-ft{order:6}
@media(min-width:960px){
  main{max-width:1200px;padding:20px}
  .a-tabs{margin-top:0}.tabs{margin-top:0}.tabs button{font-size:14px;padding:9px 6px}
  .cd{min-height:84px}.box{max-width:430px}
}

.tkr{display:flex;align-items:stretch;border-radius:12px;overflow:hidden;color:#fff;margin:10px 0 6px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tkl{background:rgba(0,0,0,.3);padding:7px 11px;font-size:13px;font-weight:700;white-space:nowrap;position:relative;z-index:1}
.tkw{overflow:hidden;flex:1;display:flex;align-items:center}
.tkt{white-space:nowrap;display:inline-block;padding-left:100%;animation:tkm 30s linear infinite;font-size:14px}
@keyframes tkm{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.ser{min-width:28px;width:28px;height:28px;border-radius:50%;background:var(--ac);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;box-shadow:0 1px 4px rgba(30,58,138,.35)}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.opts3{grid-template-columns:repeat(3,1fr)}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px;border-radius:16px;text-align:center;background:linear-gradient(160deg,var(--card),var(--acbg));border:1px solid var(--bd);box-shadow:0 2px 8px rgba(30,58,138,.1)}
.opt .oi{font-size:32px}.opt .ot{font-weight:700;font-size:15px}.opt .os{font-size:12px;color:var(--mu);line-height:1.4}
.opts3 .opt{padding:12px 6px}.opts3 .oi{font-size:24px}.opts3 .ot{font-size:13px}
.cr{display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:6px;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:12px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.cr .cdt{font-weight:700;font-size:13px;white-space:nowrap;min-width:96px}.cr .cnm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cr .ser{width:24px;height:24px;min-width:24px;font-size:11px}
.cd2{font-style:normal;font-size:10px;color:var(--wr);font-weight:700;display:block;margin-top:2px;white-space:nowrap}.cr .cd2{display:inline;margin:0}.bcl{display:block;padding:4px 0;font-size:14px}
.lcb{aspect-ratio:1;padding:0;border-radius:8px;font-size:13px}.lcb.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}

:root{--t-pend:#b45309;--t-ok:#15803d;--t-mod:#6d28d9;--t-ban:#b91c1c;--t-ext:#0f766e}

.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:0 0 12px}
.mst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.mt{--tc:var(--ac);position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;padding:9px 4px 8px;text-align:center;border-radius:14px;background:var(--card);border:1.5px solid var(--bd);box-shadow:0 1px 3px rgba(16,24,40,.07)}

.mt .ml{font-size:12px;line-height:1.3;color:var(--mu)}
.mt.pend{--tc:var(--t-pend)}.mt.ok{--tc:var(--t-ok)}.mt.mod{--tc:var(--t-mod)}.mt.ban{--tc:var(--t-ban)}.mt.ext{--tc:var(--t-ext)}
.mt.on{background:var(--acbg);border-color:var(--tc);box-shadow:0 0 0 1px var(--tc)}
.mt.on .ml{color:var(--tx);font-weight:600}
.mt.al{border-color:var(--tc)}
.mt.al::after{content:'';position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--tc)}

const ntfOK=()=>!!(NOTIFY_URL&&VAPID_KEY&&window.firebase&&firebase.messaging&&'serviceWorker' in navigator&&'Notification' in window);
async function enableNotif(silent){
  try{
    if(!ntfOK()||!U||!M||!M.approved||M.banned)return;
    if(!(await firebase.messaging.isSupported())){if(!silent)alert('এই ব্রাউজারে নোটিফিকেশন চলে না। আইফোনে অ্যাপটি হোম স্ক্রিনে যোগ করে খুলুন।');return}
    if(Notification.permission==='denied'){if(!silent)alert('নোটিফিকেশন বন্ধ করা আছে। ব্রাউজার/ফোনের সেটিংস থেকে এই সাইটের নোটিফিকেশন চালু করুন।');return}
    if(Notification.permission!=='granted'){if(silent)return;const r=await Notification.requestPermission();if(r!=='granted'){alert('অনুমতি দেওয়া হয়নি');return}}
    const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    const msg=firebase.messaging();
    const t=await msg.getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    if(!t){if(!silent)alert('টোকেন পাওয়া যায়নি, আবার চেষ্টা করুন');return}
    if(!window._ntfFg){window._ntfFg=true;msg.onMessage(pl=>{const n=pl.notification||{};try{reg.showNotification(n.title||'বার্তা',{body:n.body||'',icon:'icon-192.png'})}catch(e){mtoast((n.title?n.title+': ':'')+(n.body||''))}})}
    const old=(M.fcm||[]).filter(x=>x!==t);
    if(!(M.fcm||[]).includes(t)){await db.doc('members/'+U.uid).update({fcm:[...old,t].slice(-5)})}
    window._ntfTok=t;if(!silent){mtoast('✅ নোটিফিকেশন চালু হয়েছে');}render();
  }catch(e){if(!silent)alert('চালু করা যায়নি: '+(e.code||e.message||e))}
}

      if(fb){try{un&&un()}catch(x){}un=null;on(bq.limit(100),false)}else{parts[name]=parts[name]||[];upd()}})};
    on(bq.orderBy(firebase.firestore.FieldPath.documentId(),'desc').limit(60),true);

async function postNotify(ttl,body,tmap,idToken,opt){
  const tokens=Object.keys(tmap);
  const r=await fetch(NOTIFY_URL,{method:'POST',redirect:'follow',body:JSON.stringify({idToken:idToken,title:ttl,body:body,tokens:tokens,link:location.href.split('#')[0].split('?')[0],icon:new URL('icon-192.png',location.href).href})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'ব্যর্থ');
  logNotice(ttl,body,tmap,j,opt);
  const bad=new Set(j.invalid||[]);
  if(bad.size){const per={};bad.forEach(t=>{const id=tmap[t];if(id)(per[id]=per[id]||[]).push(t)});
    for(const id in per){const m=MEMS.find(x=>x.id===id);if(m)db.doc('members/'+id).update({fcm:(m.fcm||[]).filter(x=>!per[id].includes(x))}).catch(()=>{})}}
  return j;
}

    const nl=(a==='addm'),pf=m.prof||{};let np=old,undo;

    else{np={id:'p'+Date.now().toString(36),name:pf.name||'নতুন সদস্য',phone:pf.phone||'',des:pf.des||'',rn:pf.rn||'',bp:m.bp,j:nextF(),hist:[{d:nextF(),on:false}],sp:false,ext:true,nl:nl};S.people.push(np);undo=()=>{S.people=S.people.filter(x=>x!==np)}}
    saveR().then(()=>{pubWeek();render();drawMem();mtoast('✅ আমার সদস্য তালিকায় যোগ হয়েছে'+(nl?'':' (ছুটির তালিকায়ও আছে)')+'। সেটিংসে গিয়ে তথ্য মিলিয়ে নিন (রোস্টার/বিশেষ ডিউটি বন্ধ আছে)')}).catch(e=>{undo();mtoast('যোগ হয়নি: '+(e.code||''))});
    return;
  }
  if(a==='lvtog'){
    const m=MEMS.find(x=>x.id===b.dataset.id),p=m&&pOfM(m);if(!p)return;
    if(!db||!editor){mtoast('অনুমতি নেই');return}
    p.nl=!p.nl;
    saveR().then(()=>{render();drawMem();mtoast(p.nl?'ছুটির তালিকা থেকে সরানো হয়েছে':'✅ ছুটির তালিকায় নেওয়া হয়েছে')}).catch(e=>{p.nl=!p.nl;mtoast('হয়নি: '+(e.code||''))});
    return;
  }
  let w=null;
  const need=k=>{const now=Date.now();if(window._mc&&window._mc.k===k&&now-window._mc.t<4000)return true;window._mc={k:k,t:now};b.textContent='⚠ আবার চাপুন';setTimeout(()=>{if($('gx'))drawMem()},4000);return false};
  if(a==='pw'){if(need('pw'+b.dataset.id))w=r.update(U2.pw)}
  else if(a==='ban'){if(need('ban'+b.dataset.id))w=r.update(U2.ban)}
  else if(a==='del'){if(need('del'+b.dataset.id))w=r.delete()}
  else if(a==='extout'){const m=MEMS.find(x=>x.id===b.dataset.id),p=m&&pOfM(m);if(!p||!p.ext)return;if(!db||!editor){mtoast('অনুমতি নেই');return}
    if(need('xo'+b.dataset.id)){setDuty(p,false);p.sp=false;p.gone=true;w=saveR().then(()=>{pubWeek();render();drawMem()}).catch(e=>{p.gone=false;throw e})}}
  else if(U2[a])w=r.update(U2[a]);
  if(w)w.then(()=>{if(a==='del'||a==='ban'||a==='extout')mtoast('✅ হয়েছে')}).catch(e=>mtoast('হয়নি: '+(e.code||e.message||'')));
}

/* ---- পাবলিক ডকুমেন্ট তৈরি (শুধু নাম, পদবী, ছোট ছবি) ---- */
function thumb(src){return new Promise(r=>{if(!src)return r('');const im=new Image();im.onload=()=>{const k=Math.min(1,100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};im.onerror=()=>r('');im.src=src})}
async function emMap(){
  const cnt={},em={};
  MEMS.forEach(m=>{if(m.email)cnt[String(m.email).trim().toLowerCase()]=(cnt[String(m.email).trim().toLowerCase()]||0)+1});
  for(const m of MEMS){
    const e=m.email?String(m.email).trim().toLowerCase():'';
    if(!e||!m.bp||m.banned||m.approved!==true||cnt[e]>1)continue;
    const h=await emH(e);if(h)em[h]=bpn(m.bp)}
  return em;
}
async function pubEm(){
  if(!isAdm||!rReady||!db||window._emBusy)return;
  window._emBusy=true;
  try{const em=await emMap();
    if(JSON.stringify(em)!==window._emSig)await pubWeek()}catch(e){}finally{window._emBusy=false}
}

async function pubAuto(){
  if(!db||!editor)return;
  try{
    const cur=curFri(),end=addD(cur,56),items=[];
    const bpP=id=>{const q=P(id);return q&&q.bp?bpn(q.bp):''};
    sim().filter(w=>w.date>=cur&&w.date<=end).forEach(w=>{
      try{
        const sat=addD(w.date,1),thu=addD(w.date,-1);
        if(!S.sent[w.date]){
          const L=(w.fri&&w.sat&&w.fri===w.sat&&w.fri===w.duty)?[[w.fri,msgDuty(w)]]:[w.fri&&[w.fri,msgDay(w,'f')],w.sat&&[w.sat,msgDay(w,'s')]].filter(Boolean);
          L.forEach(x=>{const b=bpP(x[0]);if(b)items.push({d:thu,s:'thu',title:'রোস্টার ডিউটি',body:x[1],to:[b]})});
        }
        [['fri',w.fri,w.date],['sat',w.sat,sat]].forEach(x=>{
          if(!x[1]||(S.onsent&&S.onsent[x[2]]))return;
          items.push({d:x[2],s:x[0],title:'আজ ডিউটিতে কর্তব্যরত',body:msgAuto(x[1],w,x[2]),to:'all',ex:[bpP(x[1])].filter(Boolean)});
        });
      }catch(e){console.error(e)}
    });
    const t0=iso(new Date());
    simSp().filter(x=>x.duty&&x.date>=t0&&x.date<=end).forEach(x=>{
      try{
        const b=bpP(x.duty),dd=addD(x.date,-1);
        if(b&&dd>=t0&&!(S.spsent&&S.spsent[x.date]))items.push({d:dd,s:'spb',title:'বিশেষ ডিউটি',body:msgSp(x),to:[b]});
        items.push({d:x.date,s:'spd',title:'আজ বিশেষ ডিউটিতে কর্তব্যরত',body:msgSpAuto(x),to:'all',ex:[b].filter(Boolean)});
      }catch(e){console.error(e)}
    });
    const a=S.auto||{};
    const payload={cfg:{on:!!a.on,thu:a.thu!==false,fs:a.fs!==false,tt:a.tt||'16:00',tf:a.tf||'09:00',ts:a.ts||'09:00',sb:a.sb!==false,sd:a.sd!==false,tsb:a.tsb||'16:00',tsd:a.tsd||'09:00'},items:items,link:location.href.split('#')[0].split('?')[0],icon:new URL('icon-192.png',location.href).href};
    await db.doc('private/auto').set({json:JSON.stringify(payload),t:Date.now()});
  }catch(e){console.error(e)}
}
async function pubWeek(){
  if(!editor||!db)return;
  try{
    const cur=curFri(),out=sim().filter(w=>w.date>=cur).slice(0,6),ws=[];
    for(const w of out){const p=w.duty&&P(w.duty);ws.push({date:w.date,n:p?(p.name||''):'',r:p?(p.des||''):'',ph:p?await thumb(p.photo):''})}
    const d={weeks:ws,t:Date.now(),des:optList('des')};
    if(isAdm){const em=await emMap();d.em=em;window._emSig=JSON.stringify(em);await db.doc('public/week').set(d)}
    else await db.doc('public/week').set(d,{merge:true});
  }catch(e){console.error(e)}
}
