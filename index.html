<title>রোস্টার ডিউটি · কেন্দ্রীয় ডেসপাচ শাখা</title>

<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2330;--mu:#667085;--ac:#1e3a8a;--acbg:#e8edfb;--wr:#92400e;--wrbg:#fef3c7;--bd:#e4e7ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1419;--card:#1a212b;--tx:#e8ecf1;--mu:#9aa5b4;--ac:#8fa8ff;--acbg:#1a2347;--wr:#fbbf24;--wrbg:#3a2e0e;--bd:#2a3340}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1419;--card:#1a212b;--tx:#e8ecf1;--mu:#9aa5b4;--ac:#8fa8ff;--acbg:#1a2347;--wr:#fbbf24;--wrbg:#3a2e0e;--bd:#2a3340}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali',system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0}h2{font-size:15px;color:var(--mu);margin:22px 0 8px}
.sub{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.cur{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}
.badge{background:var(--ac);color:var(--bg);border-radius:99px;padding:1px 10px;font-size:12px}
.duty{font-size:20px;font-weight:700;margin:4px 0}
.note{background:var(--wrbg);color:var(--wr);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.tag{background:var(--acbg);color:var(--ac);border-radius:8px;padding:2px 8px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button,.btn,select,input{font:inherit;font-size:14px}
button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 12px;text-decoration:none;cursor:pointer}
.wa{background:#16a34a;color:#fff;border-color:#16a34a}
.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}
select,input{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 10px}
.sent{color:var(--ac);font-size:13px}
.chip{background:var(--wrbg);color:var(--wr);border-radius:99px;padding:2px 10px;font-size:12px}
.chip b{cursor:pointer;margin-left:6px}
.set input{width:100%;margin-bottom:6px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hero{background:var(--acbg);border:1px solid var(--ac);border-radius:16px;padding:14px 16px;margin:12px 0}.hero .duty{font-size:26px}
.ban{background:linear-gradient(135deg,#141d63,#2a3ca8);color:#fff;border-radius:16px;padding:18px 14px 14px;text-align:center;margin-bottom:10px;border-bottom:5px solid #84c225}.ban .lg{width:84px;height:auto;background:#fff;border-radius:14px;padding:6px;margin-bottom:8px}.ban .o{font-size:13px;opacity:.9;letter-spacing:.3px}.ban .b{font-size:23px;font-weight:700;margin:2px 0}.ban .m{font-size:12px;opacity:.85;margin-top:2px}.ban .r{display:inline-block;margin-top:8px;border:1px solid #fff;border-radius:99px;padding:1px 16px;font-size:13px}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.mdl .box{background:var(--card);border-radius:16px;padding:18px;max-width:340px;width:100%;text-align:center}
.tw{overflow-x:auto;padding:6px}.tw table{width:100%;border-collapse:collapse;font-size:13px}.tw th,.tw td{border:1px solid var(--bd);padding:6px 8px;text-align:left;white-space:nowrap}.tw th{background:var(--acbg);color:var(--ac)}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.ch{text-align:center;font-size:11px;color:var(--mu)}
.cd{min-height:62px;border:1px solid var(--bd);border-radius:8px;padding:2px;text-align:center;font-size:11px;background:var(--card)}
.cd.wk{background:var(--acbg)}.cd.ho{background:var(--wrbg)}.cd.td{outline:2px solid var(--ac)}.cd b{display:block;font-size:12px}
.cn{display:block;font-size:9px;line-height:1.1;word-break:break-all}.cl{display:block;font-size:9px;color:var(--wr)}.cd.wk .cl{color:var(--mu)}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;margin:1px auto 0;display:flex;align-items:center;justify-content:center;background:var(--ac);color:var(--bg);font-size:12px}
.g>input{min-width:0;width:100%}
.ban .ck{margin-top:8px;font-size:13px;opacity:.95}.ban .ck b{font-size:22px;display:block;letter-spacing:.5px}
</style></head>

async function exportCsv(){
  try{
  const cur=curFri(),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['সপ্তাহ (শুক্র)','শনিবার','ডিউটিকারী','পদবী','বিপি নম্বর','অবস্থা','মন্তব্য']];
  sim().filter(w=>w.date<=cur||S.sent[w.date]).reverse().forEach(w=>{const p=S.people.find(x=>x.id===w.duty)||{};
    const nt=[];if(w.man)nt.push('ম্যানুয়াল: '+((S.manual[w.date]||{}).note||''));if(w.sk.length&&!w.man)nt.push('বদলি ডিউটি');if(S.sent[w.date])nt.push('মেসেজ: '+S.sent[w.date]);if(w.mk)nt.push('অনুপস্থিতির বদলি ডিউটি');if(w.sk.length)nt.push(w.sk.map(nm).join(', ')+' অনুপস্থিত');
    rows.push([w.date,addD(w.date,1),p.name||'',rk(w.duty),p.bp||'',w.date<cur?'সম্পন্ন':w.date===cur?'চলমান':'নির্ধারিত',nt.join('; ')])});
  const csv='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n');
  const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const l=document.createElement('a');l.href=u;l.download='roster-duty.csv';document.body.appendChild(l);l.click();l.remove();
  }catch(e){if(!e||e.code!=='declined')alert('ডাউনলোড হয়নি')}
}

document.addEventListener('click',e=>{

  else if(a==='pno'){ppend=null;render()}
  else if(a==='call'){cpend={n:b.dataset.cn,p:b.dataset.p};render()}

  else if(a==='absdlg'){apend=d;render()}
  else if(a==='absno'){apend=null;render()}
  else if(a==='absyes'){const pw=sim().find(x=>x.date===apend);const v=(document.getElementById('subsel')||{}).value;if(pw&&pw.duty){const ab=S.absent[apend]||[];if(!ab.includes(pw.duty))ab.push(pw.duty);S.absent[apend]=ab;if(v)S.sub[apend]=v;else delete S.sub[apend]}apend=null;save()}
  else if(a==='wa'){wpend={u:b.dataset.u,m:b.dataset.m};render()}
  else if(a==='wyes'){wpend=null;setTimeout(render,0)}
  else if(a==='wno'){wpend=null;render()}
  else if(a==='csv'){exportCsv()}
  else if(a==='sent'){pend=d;render()}
  else if(a==='yes'){S.sent[pend]=fd(iso(new Date()));pend=null;save()}
  else if(a==='no'){pend=null;render()}
  else if(a==='unsent'){delete S.sent[d];save()}
  else if(a==='rm'){S.absent[d]=(S.absent[d]||[]).filter(x=>x!==b.dataset.id);save()}
  else if(a==='save'){
    collect();
    const st=document.getElementById('st').value;if(st)S.start=st;
    showSet=false;save();
  }
});
